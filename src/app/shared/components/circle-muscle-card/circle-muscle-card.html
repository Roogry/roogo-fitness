<div class="flex flex-col items-center gap-2 group">
  <div
    class="w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-secondary/50 flex items-center justify-center p-2 border-2 transition-colors relative"
    [class.border-primary]="selected()"
    [class.border-transparent]="!selected()"
    [class.bg-primary/5]="selected()"
  >
    @if (muscle().icon_url) {
      <img
        [ngSrc]="muscle().icon_url || ''"
        [alt]="muscle().name"
        fill
        class="object-contain p-2"
      />
    }

    @if (selected()) {
      <div
        class="absolute -top-1 -right-1 bg-primary text-primary-foreground rounded-full p-0.5 border border-background flex items-center justify-center"
      >
        <ng-icon name="lucideCheck" class="w-3 h-3"></ng-icon>
      </div>
    }
  </div>

  @if (muscle().name) {
    <span
      class="text-xs font-medium text-center transition-colors"
      [class.text-primary]="selected()"
      [class.text-muted-foreground]="!selected()"
    >
      {{ muscle().name }}
    </span>
  }
</div>
