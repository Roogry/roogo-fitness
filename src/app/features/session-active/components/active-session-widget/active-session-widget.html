<div
  class="active-session-widget cursor-pointer flex items-center justify-between p-4 rounded-full border border-forest select-none transition-all active:scale-[0.98] bg-forest text-white hover:bg-forest/90 backdrop-blur-md"
  (click)="goToActiveSession()"
>
  <!-- Left Side: Icon and Details -->
  <div class="flex items-center gap-3 min-w-0">
    <div
      class="icon-container flex items-center justify-center size-10 rounded-full bg-white/15 text-white flex-shrink-0"
    >
      <ng-icon name="lucideDumbbell" class="size-5 animate-pulse"></ng-icon>
    </div>

    <div class="flex flex-col min-w-0">
      <div class="flex items-center gap-2">
          <span class="relative flex h-3 w-3">
          <span
            class="animate-ping absolute inline-flex h-full w-full rounded-full bg-lime opacity-75"
          ></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-lime"></span>
        </span>
        <span class="text-sm font-semibold text-white truncate leading-tight">
          {{ workoutService.sessionTitle() || 'Workout Session' }}
        </span>
      </div>
      <span class="text-xs text-white/70 mt-0.5 leading-none">
        {{ workoutService.completedExercises() }}/{{ workoutService.totalExercises() }} Exercises •
        {{ workoutService.completedSets() }}/{{ workoutService.totalSets() }} Sets
      </span>
    </div>
  </div>

  <!-- Right Side: Duration Timer -->
  <div class="flex items-center gap-2">
    <div
      class="timer-badge flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-lime text-ink font-mono font-bold text-xs tracking-wider"
    >
      <span>{{ workoutService.sessionDuration() | durationFormat }}</span>
    </div>
  </div>
</div>
