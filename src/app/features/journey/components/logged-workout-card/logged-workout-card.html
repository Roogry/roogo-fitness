<div class="bg-card border border-border rounded-2xl sm:rounded-[28px] overflow-hidden">
  <z-card [zLessPadding]="true">
    <div class="flex justify-between items-center">
      <div class="flex flex-col gap-2 p-3">
        <span class="font-bold text-base sm:text-lg">{{ session().session_title }}</span>
        <div class="flex items-center gap-2">
          <z-badge zType="secondary" class="font-mono">
            {{ session().total_duration | durationFormat }}
          </z-badge>
          <z-badge zType="secondary" class="font-mono">
            {{ session().total_weight_lifted | number: '1.0-1' }} kg
          </z-badge>
        </div>
      </div>

      <div class="items-center gap-2 hidden sm:flex">
        <span
          class="text-sm text-muted-foreground"
          [zTooltip]="session().createdAt ? (session().createdAt | date: 'medium') : 'unknown'"
        >
          {{ session().createdAt | timeAgo }}
        </span>
        <div class="bg-accent text-foreground size-8 rounded-full flex items-center justify-center border border-border">
          <ng-icon name="lucideActivity"></ng-icon>
        </div>
      </div>
    </div>

    <a
      [routerLink]="['/journey', session().id]"
      class="bg-muted rounded-[16px] p-3.5 flex justify-between items-center group cursor-pointer hover:bg-secondary transition-colors border border-transparent hover:border-border"
    >
      <span class="text-sm font-medium text-secondary-foreground line-clamp-1 truncate mr-4">
        {{ getExerciseSummary(session()) }}
      </span>
      <div class="bg-background/50 rounded-full p-1.5 group-hover:bg-background transition-colors">
        <ng-icon name="lucideArrowRight" class="w-4 h-4 text-foreground flex-shrink-0"></ng-icon>
      </div>
    </a>
  </z-card>

  @if (session().notes) {
    <div class="py-3 px-4 sm:px-5">
      <p class="text-sm text-muted-foreground italic">"{{ session().notes }}"</p>
    </div>
  }
</div>
