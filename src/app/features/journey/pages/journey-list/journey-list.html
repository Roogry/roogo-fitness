<app-header title="Your Journey"></app-header>
<div class="px-4 w-full max-w-2xl mx-auto flex flex-col gap-4">
  <!-- Tab Pills Navigation -->
  <app-nav-pills>
    <button app-nav-pills-item [active]="activeTab() === 'stats'" (click)="setTab('stats')">
      Stats
    </button>
    <button app-nav-pills-item [active]="activeTab() === 'history'" (click)="setTab('history')">
      History
    </button>
  </app-nav-pills>

  <!-- Tab Contents -->
  @if (activeTab() === 'stats') {
    <app-journey-stats></app-journey-stats>
  } @else if (activeTab() === 'history') {
    <app-journey-history></app-journey-history>
  }
</div>
