<div class="w-full flex flex-col gap-6">
  @if (isLoading()) {
    <div class="flex items-center justify-center p-12">
      <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-primary"></div>
    </div>
  } @else {
    <!-- Calendar View -->
    <div
      class="flex flex-col bg-card p-5 rounded-3xl border border-border shadow-xs w-full"
      (touchstart)="onTouchStart($event)"
      (touchend)="onTouchEnd($event)"
    >
      <!-- Navigation Header -->
      <div class="flex items-center justify-between w-full px-2">
        <button
          type="button"
          (click)="onPreviousMonth()"
          class="flex items-center justify-center p-1.5 rounded-lg border border-border bg-background hover:bg-muted text-muted-foreground hover:text-foreground transition-colors cursor-pointer"
          aria-label="Previous month"
        >
          <ng-icon name="lucideChevronLeft" class="w-4 h-4"></ng-icon>
        </button>
        <span class="text-sm font-semibold text-foreground">
          {{ monthName() }} {{ currentYear() }}
        </span>
        <button
          type="button"
          (click)="onNextMonth()"
          class="flex items-center justify-center p-1.5 rounded-lg border border-border bg-background hover:bg-muted text-muted-foreground hover:text-foreground transition-colors cursor-pointer"
          aria-label="Next month"
        >
          <ng-icon name="lucideChevronRight" class="w-4 h-4"></ng-icon>
        </button>
      </div>

      <!-- Calendar Grid -->
      <div class="w-full mt-4 select-none">
        <z-calendar-grid
          class="w-full block [&_.grid]:w-full [&_[role=row]]:w-full [&_[role=rowgroup]]:w-full [&_[role=gridcell]]:flex [&_[role=gridcell]]:justify-center [&_[role=columnheader]]:flex [&_[role=columnheader]]:justify-center"
          [calendarDays]="calendarDays()"
          (previousMonth)="onPreviousMonth()"
          (nextMonth)="onNextMonth()"
        />
      </div>
    </div>

    <!-- Streak Metrics Grid -->
    <div class="grid grid-cols-2 gap-4">
      <app-journey-stat-card
        icon="lucideFlame"
        title="Current Streak"
        [value]="currentStreak() === 1 ? '1 Week' : currentStreak() + ' Weeks'"
      ></app-journey-stat-card>

      <app-journey-stat-card
        icon="lucideTrophy"
        title="Longest Streak"
        [value]="longestStreak() === 1 ? '1 Week' : longestStreak() + ' Weeks'"
      ></app-journey-stat-card>

      <app-journey-stat-card
        icon="lucideDumbbell"
        title="Total Sessions"
        [value]="totalSessions() === 1 ? '1 Session' : totalSessions() + ' Sessions'"
      ></app-journey-stat-card>

      <app-journey-stat-card
        icon="lucideCalendar"
        title="Last Session"
        [value]="lastSession()"
      ></app-journey-stat-card>
    </div>
  }
</div>
