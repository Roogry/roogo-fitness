<div class="min-h-screen bg-background text-foreground pb-8">
  <!-- Header -->
  <app-header title="Workout Session" [showBackBtn]="true" class="sticky top-0">
    <div right>
      <button
        z-button
        zPopover
        zType="secondary"
        zSize="icon"
        zShape="circle"
        [zContent]="moreActions"
        zPlacement="bottomLeft"
      >
        <ng-icon name="lucideEllipsis"></ng-icon>
        <span class="sr-only">More</span>
      </button>

      <ng-template #moreActions>
        <z-popover>
          <div class="flex flex-col items-start">
            <button
              z-button
              zType="ghost"
              zShape="circle"
              class="w-full justify-start"
              [routerLink]="['/plan', planId, 'session', sessionId, 'edit']"
            >
              <ng-icon name="lucidePencil" class="size-4"></ng-icon>
              <span>Edit <span class="hidden sm:inline">Session</span></span>
            </button>
            <button
              z-button
              zType="ghost"
              zShape="circle"
              class="w-full justify-start text-destructive hover:text-destructive hover:bg-destructive/10"
              (click)="onDeleteSessionClick()"
            >
              <ng-icon name="lucideTrash2" class="size-4"></ng-icon>
              <span>Delete <span class="hidden sm:inline">Session</span></span>
            </button>
          </div>
        </z-popover>
      </ng-template>
    </div>
  </app-header>

  <main class="container mx-auto px-4 pb-6 max-w-2xl mt-4">
    <div class="flex flex-col gap-4">
      <h1 class="text-2xl font-bold">{{ workoutService.sessionTitle() }}</h1>

      <!-- Exercises List -->
      @if (workoutService.trackedExercises().length === 0) {
        <div
          class="py-8 text-center text-muted-foreground border-2 border-dashed border-border rounded-xl"
        >
          <p>No exercises in this session.</p>
        </div>
      }

      @for (tracked of workoutService.trackedExercises(); track tracked.exercise.id) {
        <app-exercise-tracker [trackedExercise]="tracked" [editable]="false"></app-exercise-tracker>
      }
    </div>
  </main>
</div>
