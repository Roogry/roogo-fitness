<div
  class="active-session-widget cursor-pointer flex items-center justify-between p-4 rounded-2xl border border-primary/10 shadow-lg select-none transition-all active:scale-[0.98] bg-background/95 dark:bg-background/95 backdrop-blur-md"
  (click)="goToActiveSession()"
>
  <!-- Left Side: Icon and Details -->
  <div class="flex items-center gap-3 min-w-0">
    <div class="icon-container flex items-center justify-center size-10 rounded-full bg-primary/10 text-primary flex-shrink-0">
      <ng-icon name="lucideDumbbell" class="size-5 animate-pulse-slow"></ng-icon>
    </div>
    
    <div class="flex flex-col min-w-0">
      <span class="text-sm font-semibold text-foreground truncate leading-tight">
        {{ workoutService.sessionTitle() || 'Workout Session' }}
      </span>
      <span class="text-xs text-muted-foreground mt-0.5 leading-none">
        {{ workoutService.completedExercises() }}/{{ workoutService.totalExercises() }} Exc • 
        {{ workoutService.completedSets() }}/{{ workoutService.totalSets() }} Sets
      </span>
    </div>
  </div>

  <!-- Right Side: Duration Timer -->
  <div class="flex items-center gap-2">
    <div class="timer-badge flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-primary text-primary-foreground font-semibold text-xs tracking-wider uppercase">
      <ng-icon name="lucideActivity" class="size-3.5 spin-slow"></ng-icon>
      <span>{{ workoutService.sessionDuration() | durationFormat }}</span>
    </div>
  </div>
</div>
