<div class="min-h-screen bg-background text-foreground pb-8">
  <!-- Header -->
  <app-header
    [title]="exercise() ? exercise()!.name : 'Loading...'"
    [isTransparant]="true"
    [showBackBtn]="true"
  >
    @if (exercise()) {
      <a
        right
        [routerLink]="['/exercise', exercise()!.id, 'edit']"
        z-button
        zType="outline"
        zSize="icon"
        zShape="circle"
      >
        <ng-icon name="lucidePencil"></ng-icon>
        <span class="sr-only">Edit</span>
      </a>
    }
  </app-header>

  <main class="container mx-auto px-4 pb-8 max-w-2xl">
    @if (isLoading()) {
      <div class="flex justify-center py-12 text-muted-foreground">
        <div
          class="h-8 w-8 animate-spin rounded-full border-4 border-primary border-t-transparent"
        ></div>
      </div>
    } @else if (exercise()) {
      <div class="flex flex-col gap-4">
        <!-- Pills Navigation -->
        <div
          class="flex p-1 bg-muted/60 rounded-full w-full max-w-xs mx-auto mb-2 border border-border/50"
        >
          <button [class]="getPillClass('overview')" (click)="setTab('overview')">Overview</button>
          <button [class]="getPillClass('journey')" (click)="setTab('journey')">Journey</button>
        </div>

        <!-- Tab Contents -->
        @switch (activeTab()) {
          @case ('overview') {
            <app-exercise-overview [exercise]="exercise()!" />
          }
          @case ('journey') {
            <app-exercise-journey
              [highestWeight]="highestWeight()"
              [highestWeightReps]="highestWeightReps()"
              [totalSets]="totalSets()"
              [lastLogged]="lastLogged()"
              [recentSessions]="recentSessions()"
            />
          }
        }
      </div>
    } @else {
      <div
        class="py-12 text-center text-muted-foreground border-2 border-dashed border-border rounded-xl mt-6"
      >
        <ng-icon name="lucideDumbbell" class="h-12 w-12 mx-auto mb-4 opacity-20"></ng-icon>
        <h2 class="text-xl font-semibold text-foreground mb-2">Exercise Not Found</h2>
        <p>The exercise you requested could not be found.</p>
        <a routerLink="/" z-button class="mt-6">Return Home</a>
      </div>
    }
  </main>
</div>
