<div class="flex flex-col gap-6">
  <!-- Stats Row -->
  <div class="grid grid-cols-2 gap-4">
    <z-card>
      <div class="flex flex-col items-center text-center py-2">
        <span class="text-3xl font-extrabold mb-1 text-primary">
          {{ highestWeight() ? (highestWeight() | number:'1.0-1') + ' kg' : '-' }}
        </span>
        <span class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">
          Personal Record
        </span>
      </div>
    </z-card>
    <z-card>
      <div class="flex flex-col items-center text-center py-2">
        <span class="text-3xl font-extrabold mb-1 text-primary">
          {{ totalSets() || 0 }}
        </span>
        <span class="text-xs font-semibold text-muted-foreground uppercase tracking-wider">
          Total Sets (All Time)
        </span>
      </div>
    </z-card>
  </div>

  <!-- History Section -->
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <h3 class="font-bold text-lg text-foreground">Recent History</h3>
    </div>

    <app-recent-exercise [recentSessions]="recentSessions()"></app-recent-exercise>
  </div>
</div>
