<div class="flex flex-col gap-6">
  <!-- Stats Row -->
  <div class="grid grid-cols-2 gap-4">
    <z-card>
      <div class="flex flex-col gap-3 items-center text-center py-2">
        <span class="text-3xl font-extrabold text-primary">
          {{ highestWeight() ? (highestWeight() | number: '1.0-1') + ' kg' : '-' }}
        </span>
        <span class="text-xs font-semibold text-muted-foreground uppercase">Personal Record</span>
      </div>
    </z-card>
    <z-card>
      <div class="flex flex-col gap-3 items-center text-center py-2">
        <span class="text-3xl font-extrabold text-primary">
          {{ totalSets() || 0 }}
        </span>
        <span class="text-xs font-semibold text-muted-foreground uppercase">Total Sets</span>
      </div>
    </z-card>
  </div>

  <!-- History Section -->
  <div class="flex flex-col gap-4">
    <div class="flex items-center gap-2">
      <h3 class="font-bold text-lg text-foreground">Recent History</h3>
    </div>

    <div class="flex flex-col gap-4">
      @for (session of recentSessions(); track session.id) {
        <app-recent-exercise-card [session]="session"></app-recent-exercise-card>
      } @empty {
        <div
          class="py-12 text-center text-muted-foreground border-2 border-dashed border-border rounded-4xl bg-muted/5"
        >
          <ng-icon name="lucideFlame" class="h-10 w-10 mx-auto mb-3 opacity-25"></ng-icon>
          <p class="text-sm font-medium">No recorded sessions for this exercise yet.</p>
        </div>
      }
    </div>
  </div>
</div>
