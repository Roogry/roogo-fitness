<app-header title="Edit Exercise" [showBackBtn]="true" (onBackClick)="cancel()"> </app-header>
<main class="container mx-auto px-4 pb-8 max-w-2xl">
  @if (isLoading()) {
    <div class="flex justify-center py-12 text-muted-foreground">
      <div
        class="h-8 w-8 animate-spin rounded-full border-4 border-primary border-t-transparent"
      ></div>
    </div>
  } @else if (!selectedExercise()) {
    <div
      class="py-12 text-center text-muted-foreground border-2 border-dashed border-border rounded-xl"
    >
      <h2 class="text-xl font-semibold text-foreground mb-2">Exercise Not Found</h2>
      <button (click)="cancel()" z-button class="mt-4">Go Back</button>
    </div>
  } @else {
    <form (submit)="$event.preventDefault(); save()" class="flex flex-col gap-6">
      <!-- Card 1: General Information -->
      <z-card zTitle="General Information" class="overflow-hidden border-border bg-card">
        <div class="flex flex-col gap-6">
          <z-form-field class="flex flex-col gap-3">
            <label
              z-form-label
              for="name"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
            >
              Exercise Name <span class="text-destructive">*</span>
            </label>
            <z-form-control
              [errorMessage]="
                submitted() && exerciseForm.name().invalid()
                  ? (exerciseForm.name().errors()[0]?.message ?? '')
                  : ''
              "
            >
              <input
                id="name"
                z-input
                [formField]="exerciseForm.name"
                [zStatus]="submitted() && exerciseForm.name().invalid() ? 'error' : undefined"
                placeholder="e.g. Barbell Bench Press"
                class="w-full text-base"
              />
            </z-form-control>
          </z-form-field>

          <z-form-field class="flex flex-col gap-3">
            <label
              z-form-label
              for="short_description"
              class="text-sm font-medium leading-none"
            >
              Short Description
            </label>
            <z-form-control>
              <textarea
                id="short_description"
                z-input
                [formField]="exerciseForm.short_description"
                placeholder="e.g. A brief description of the exercise..."
                rows="3"
                class="w-full min-h-[80px] p-3"
              ></textarea>
            </z-form-control>
          </z-form-field>

          <z-form-field class="flex flex-col gap-3">
            <label
              z-form-label
              for="muscle"
              class="text-sm font-medium leading-none peer-disabled:cursor-not-allowed peer-disabled:opacity-70"
            >
              Primary Muscle <span class="text-destructive">*</span>
            </label>
            <z-form-control
              [errorMessage]="
                submitted() && exerciseForm.primaryGroup().invalid()
                  ? (exerciseForm.primaryGroup().errors()[0]?.message ?? '')
                  : ''
              "
            >
              <z-select
                id="muscle"
                name="muscle"
                class="w-full"
                zPlaceholder="e.g. Chest"
                [formField]="exerciseForm.primaryGroup"
              >
                <z-select-item zValue="" disabled>Select primary muscle</z-select-item>
                @for (muscle of availableMuscles(); track muscle.id) {
                  <z-select-item [zValue]="muscle.name">{{ muscle.name }}</z-select-item>
                }
              </z-select>
            </z-form-control>
          </z-form-field>

          <div class="flex flex-col gap-3">
            <label
              for="secondary"
              class="text-sm font-medium leading-none flex justify-between items-center"
            >
              Secondary Muscles
            </label>
            <z-select
              id="secondary"
              name="secondary"
              [zMultiple]="true"
              [zMaxLabelCount]="2"
              [(zValue)]="secondaryMuscles"
              zPlaceholder="e.g. Triceps, Front Delts"
              class="w-full"
            >
              @for (muscle of availableMuscles(); track muscle.id) {
                <z-select-item [zValue]="muscle.name">{{ muscle.name }}</z-select-item>
              }
            </z-select>
          </div>
        </div>
      </z-card>

      <!-- Card 2: Instructions & Tips -->
      <z-card zTitle="Instructions & Tips" class="overflow-hidden border-border bg-card">
        <div class="flex flex-col gap-6">
          <app-exercise-instruction-list
            [instructions]="exerciseForm.instructions"
            (addInstruction)="addInstruction()"
            (removeInstruction)="removeInstruction($event)"
            (dropInstruction)="drop($event)"
          ></app-exercise-instruction-list>

          <z-form-field class="flex flex-col gap-3">
            <label z-form-label for="tips" class="text-sm font-medium leading-none">
              Exercise Tips
            </label>
            <z-form-control>
              <textarea
                id="tips"
                z-input
                [formField]="exerciseForm.tips"
                placeholder="e.g. Keep your elbows slightly tucked to protect your shoulders..."
                rows="3"
                class="w-full min-h-[80px] p-3"
              ></textarea>
            </z-form-control>
          </z-form-field>
        </div>
      </z-card>

      <!-- Card 3: Media Management -->
      <z-card zTitle="Media Management" class="overflow-hidden border-border bg-card">
        <app-exercise-media-management
          [media]="media()"
          (addMedia)="addMedia($event)"
          (removeMedia)="removeMedia($event)"
          (moveMediaUp)="moveMediaUp($event)"
          (moveMediaDown)="moveMediaDown($event)"
        ></app-exercise-media-management>
      </z-card>

      <!-- Form Actions -->
      <div class="flex flex-col-reverse sm:flex-row gap-3 sm:justify-end">
        <button
          type="button"
          z-button
          zType="ghost"
          zSize="lg"
          zShape="circle"
          (click)="cancel()"
          class="w-full sm:w-auto"
        >
          <ng-icon name="lucideX" class="h-4 w-4"></ng-icon> Cancel
        </button>
        <button
          type="submit"
          z-button
          zSize="lg"
          zShape="circle"
          [disabled]="exerciseForm().invalid() || isSaving()"
          class="w-full sm:w-auto"
        >
          <ng-icon name="lucideSave" class="h-4 w-4"></ng-icon> Save Changes
        </button>
      </div>
    </form>
  }
</main>
