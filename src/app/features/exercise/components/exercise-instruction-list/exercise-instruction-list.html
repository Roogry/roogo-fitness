<div class="flex flex-col gap-3">
  <label class="text-sm font-medium leading-none">Instructions</label>
  <div
    cdkDropList
    (cdkDropListDropped)="onDrop($event)"
    class="flex flex-col gap-3 drag-drop-list"
  >
    @for (instruction of instructions(); track $index) {
      <div
        cdkDrag
        class="flex items-center gap-3 p-3 border border-border rounded-xl bg-muted/30 drag-drop-item"
      >
        <div
          cdkDragHandle
          class="cursor-grab text-muted-foreground flex items-center shrink-0"
        >
          <ng-icon name="lucideGripVertical" class="h-5 w-5"></ng-icon>
        </div>
        <span class="text-sm font-semibold shrink-0 w-6">{{ $index + 1 }}.</span>
        <z-form-control class="flex-1">
          <input
            z-input
            [formField]="instruction"
            placeholder="e.g. Lie flat on the bench..."
            class="w-full"
          />
        </z-form-control>
        <button
          type="button"
          title="Remove Step"
          z-button
          zType="ghost"
          zSize="icon-sm"
          zShape="circle"
          class="text-destructive hover:text-destructive shrink-0"
          (click)="onRemove($index)"
        >
          <ng-icon name="lucideTrash2" class="h-4 w-4"></ng-icon>
        </button>
      </div>
    }
    @if (instructions().length === 0) {
      <div
        class="py-6 text-center text-sm text-muted-foreground border border-dashed border-border rounded-xl"
      >
        No instructions added yet. Click "Add Step" to add one.
      </div>
    }
  </div>
  <button
    type="button"
    z-button
    zType="secondary"
    class="w-full"
    (click)="onAdd()"
  >
    <ng-icon name="lucidePlus" class="mr-2"></ng-icon> Add Step
  </button>
</div>
