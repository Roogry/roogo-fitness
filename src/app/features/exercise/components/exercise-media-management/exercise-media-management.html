<div class="flex flex-col gap-6">
  <div class="flex flex-col gap-3">
    @for (m of media(); track m.id; let i = $index) {
      <div class="flex items-center gap-3 p-3 border border-border rounded-xl bg-muted/30">
        <div
          class="h-12 w-16 bg-muted rounded-lg overflow-hidden shrink-0 flex items-center justify-center"
        >
          @if (m.media_type === 'youtube' || m.media_type === 'video') {
            <ng-icon name="lucideVideo" class="h-5 w-5 text-muted-foreground"></ng-icon>
          } @else {
            <img
              [src]="m.media_url"
              class="h-full w-full object-cover text-[8px]"
              alt="media"
            />
          }
        </div>
        <div class="flex flex-col flex-1 overflow-hidden">
          <span class="text-xs font-semibold capitalize">{{ m.media_type }}</span>
          <span class="text-xs text-muted-foreground truncate">{{ m.media_url }}</span>
        </div>
        <div class="flex items-center gap-1">
          <button
            type="button"
            title="Move Up"
            z-button
            zType="ghost"
            zSize="icon-sm"
            zShape="circle"
            [disabled]="i === 0"
            (click)="onMoveUp(i)"
          >
            <ng-icon name="lucideChevronUp" class="h-4 w-4"></ng-icon>
          </button>
          <button
            type="button"
            title="Move Down"
            z-button
            zType="ghost"
            zSize="icon-sm"
            zShape="circle"
            [disabled]="i === media().length - 1"
            (click)="onMoveDown(i)"
          >
            <ng-icon name="lucideChevronDown" class="h-4 w-4"></ng-icon>
          </button>
          <button
            type="button"
            title="Remove"
            z-button
            zType="ghost"
            zSize="icon-sm"
            zShape="circle"
            class="text-destructive hover:text-destructive"
            (click)="onRemove(i)"
          >
            <ng-icon name="lucideTrash2" class="h-4 w-4"></ng-icon>
          </button>
        </div>
      </div>
    }

    @if (media().length === 0) {
      <div
        class="py-6 text-center text-sm text-muted-foreground border border-dashed border-border rounded-xl"
      >
        No media added yet.
      </div>
    }
  </div>

  <div class="flex items-start gap-2 mt-2">
    <div class="flex-1 flex flex-col gap-2">
      <input
        z-input
        type="url"
        [(value)]="newMediaUrl"
        name="newMediaUrl"
        placeholder="Add image or YouTube URL..."
        class="w-full"
      />
    </div>
    <button
      type="button"
      z-button
      zType="secondary"
      zShape="circle"
      class="h-12"
      (click)="onAdd()"
      [disabled]="!newMediaUrl().trim()"
    >
      <ng-icon name="lucidePlus"></ng-icon> Add
    </button>
  </div>
</div>
