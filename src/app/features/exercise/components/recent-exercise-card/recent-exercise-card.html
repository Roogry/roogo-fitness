<z-card [zLessPadding]="true" zRounded="sm">
  <!-- Session Header -->
  <div class="p-3 flex flex-col gap-1 sm:flex-row sm:items-center justify-between">
    <span class="font-bold text-sm text-foreground sm:text-base">{{ session().sessionTitle }}</span>
    <div class="flex items-center gap-1.5 text-xs text-muted-foreground">
      <ng-icon name="lucideCalendar" class="size-3.5"></ng-icon>
      <span>{{ session().startTime | date: 'MMM d, y, h:mm a' }}</span>
    </div>
  </div>

  <!-- Sets Content -->
  <div class="flex flex-col gap-2">
    <div class="grid gap-2 items-center text-xs" [class]="`grid-cols-${session().sets.length}`">
      @for (set of session().sets; track set.id) {
        <div class="py-4 flex items-center justify-center bg-muted/80 rounded-lg">
          <p class="font-medium">
            {{ set.weight_lifted ?? '-' }} kg, {{ set.reps_completed ?? '-' }} reps
          </p>
        </div>
      }
    </div>
  </div>
</z-card>
