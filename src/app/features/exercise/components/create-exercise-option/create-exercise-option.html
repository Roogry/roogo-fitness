<button
  type="button"
  data-testid="create-exercise-option"
  class="bg-accent rounded-xl border border-border p-4 hover:border-forest/20 cursor-pointer flex justify-between items-center transition-all w-full text-left"
  (click)="onCreate()"
>
  <div class="flex flex-col">
    <span class="font-medium text-sm text-forest">Add "{{ name() }}"</span>
    <span class="text-sm text-muted-foreground mt-1">Create a new custom exercise</span>
  </div>
  <ng-icon name="lucidePlus" class="h-5 w-5 text-forest"></ng-icon>
</button>
