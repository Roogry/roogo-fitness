<z-card>
  <div class="flex flex-col gap-2">
    <p class="font-bold text-base sm:text-lg">{{ session().session_title }}</p>

    <div class="flex items-center gap-2">
      <z-badge
        zType="secondary"
        [zTooltip]="session().createdAt ? (session().createdAt | date: 'medium') : 'unknown'"
      >
        {{ session().createdAt ? (session().createdAt | timeAgo) : 'unknown' }}
      </z-badge>

      <z-badge
        zType="secondary"
        [zTooltip]="
          (session().start_time | date: 'medium') +
          ' until ' +
          (session().end_time | date: 'medium')
        "
      >
        {{ session().total_duration | durationFormat }}
      </z-badge>

      <z-badge zType="secondary">
        {{ session().total_weight_lifted | number: '1.0-1' }} kg
      </z-badge>
    </div>
  </div>
</z-card>
