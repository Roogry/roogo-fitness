<z-card
  [zLessPadding]="true"
  class="cursor-pointer transition-colors group overflow-hidden"
  (click)="handleToggle()"
  [ngClass]="{
    'border-border': isExpanded(),
    'hover:border-lime': !isExpanded(),
  }"
>
  <div class="py-2 px-3 flex justify-between items-center">
    <div class="flex-1 flex flex-col">
      <h3 class="font-semibold text-lg">{{ plan().title }}</h3>
      <p class="text-xs text-muted-foreground">
        {{ plan().days }} days · {{ plan().sessions.length }} sessions
      </p>
    </div>

    <button
      type="button"
      z-button
      zPopover
      zType="ghost"
      zSize="icon"
      zShape="circle"
      zPlacement="bottomLeft"
      [zContent]="moreActions"
      [zVisible]="isOpenPlanActions()"
      (zVisibleChange)="isOpenPlanActions.set($event)"
      (click)="openPlanActionsSheet($event)"
    >
      <ng-icon name="lucideEllipsisVertical"></ng-icon>
      <span class="sr-only">More</span>
    </button>

    <button
      type="button"
      z-button
      [zType]="isExpanded() ? 'secondary' : 'ghost'"
      zSize="icon"
      zShape="circle"
      [class.rotate-90]="isExpanded()"
    >
      <ng-icon name="lucideChevronRight"></ng-icon>
    </button>

    <ng-template #moreActions>
      <z-popover>
        <div class="flex flex-col items-start">
          <button
            z-button
            zType="ghost"
            zShape="circle"
            class="w-full justify-start"
            (click)="editPlan($event)"
          >
            <ng-icon name="lucidePencil" class="size-4"></ng-icon>
            <span>Edit <span class="hidden sm:inline-block">Plan</span></span>
          </button>
          <button
            z-button
            zType="ghost"
            zShape="circle"
            class="w-full justify-start"
            (click)="openAddSession($event)"
          >
            <ng-icon name="lucidePlus" class="size-4"></ng-icon>
            <span>Add New Session</span>
          </button>
          <button
            z-button
            zType="ghost"
            zShape="circle"
            class="w-full justify-start text-destructive hover:text-destructive hover:bg-destructive/10"
            (click)="deletePlan($event)"
          >
            <ng-icon name="lucideTrash2" class="size-4"></ng-icon>
            <span>Delete <span class="hidden sm:inline-block">Plan</span></span>
          </button>
        </div>
      </z-popover>
    </ng-template>
  </div>

  <!-- Accordion Content (Sessions) -->
  @if (isExpanded()) {
    <div class="pt-1 flex flex-col gap-2 animate-in slide-in-from-top-2 fade-in duration-200">
      @for (session of plan().sessions; track session.id) {
        <div
          class="p-3 rounded-xl bg-muted hover:bg-secondary transition-colors cursor-pointer border border-border hover:border-forest/20"
          (click)="detailSession(session.id, $event)"
        >
          <div class="flex flex-col w-full">
            <div class="flex items-center gap-2 w-full">
              <div
                class="rounded-full p-1 bg-card border border-border flex items-center justify-center flex-shrink-0 text-muted-foreground"
              >
                <ng-icon name="lucideDumbbell" class="w-3 h-3"></ng-icon>
              </div>
              <span class="flex-1 font-medium text-sm sm:text-base">{{ session.title }}</span>
            </div>

            <!-- Exercise List -->
            <p class="text-xs text-muted-foreground line-clamp-2 mt-1 pr-4">
              {{ getExerciseNames(session) }}
            </p>

            <button
              z-button
              zShape="circle"
              zSize="xs"
              class="w-full mt-2"
              (click)="onStartSessionClick(session.id, $event)"
            >
              Start Session
            </button>
          </div>
        </div>
      }
    </div>
  }
</z-card>
