<z-card>
  <div class="flex flex-col gap-4">
    <!-- Header -->
    <div class="flex justify-between items-center">
      <a [routerLink]="['/exercise', plannedExercise().exercise.id]" class="group">
        <div class="flex items-center gap-3">
          <div
            class="h-12 w-12 rounded-full overflow-hidden bg-muted flex items-center justify-center flex-shrink-0 group-hover:opacity-60 transition-opacity"
          >
            @if (plannedExercise().exercise.media && plannedExercise().exercise.media.length > 0) {
              <img
                [src]="plannedExercise().exercise.media[0].media_url"
                [alt]="plannedExercise().exercise.name"
                class="h-full w-full object-cover"
              />
            } @else {
              <ng-icon name="lucideDumbbell" class="h-6 w-6 text-muted-foreground"></ng-icon>
            }
          </div>
          <div>
            <h3
              class="font-semibold text-base sm:text-lg text-primary group-hover:opacity-60 transition-opacity leading-tight"
            >
              {{ plannedExercise().exercise.name }}
            </h3>
            <div class="flex items-center gap-2 mt-1">
              <z-badge zType="secondary">
                {{ plannedExercise().exercise.primary_muscle?.name }}
              </z-badge>
            </div>
          </div>
        </div>
      </a>

      <button
        z-button
        zType="ghost"
        zSize="icon"
        zShape="circle"
        (click)="onRemoveClick()"
        class="text-destructive hover:bg-destructive/10"
      >
        <ng-icon name="lucideTrash2" class="h-4 w-4"></ng-icon>
      </button>
    </div>

    <!-- Inputs Row -->
    <div class="pt-2 border-t border-gray-100 dark:border-zinc-800">
      <div class="grid grid-cols-3 gap-3">
        <z-form-field>
          <label [attr.for]="'sets-' + plannedExercise().exercise.id" z-form-label class="text-xs text-muted-foreground">
            Target Sets
          </label>
          <z-form-control>
            <input
              z-input
              [id]="'sets-' + plannedExercise().exercise.id"
              type="number"
              min="1"
              placeholder="3"
              class="w-full text-center"
              [ngModel]="plannedExercise().target_sets"
              (ngModelChange)="onSetsChange($event)"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field>
          <label [attr.for]="'weight-' + plannedExercise().exercise.id" z-form-label class="text-xs text-muted-foreground">
            Weight (KG)
          </label>
          <z-form-control>
            <input
              z-input
              [id]="'weight-' + plannedExercise().exercise.id"
              type="number"
              min="0"
              step="0.5"
              placeholder="0"
              class="w-full text-center"
              [ngModel]="plannedExercise().target_weight"
              (ngModelChange)="onWeightChange($event)"
            />
          </z-form-control>
        </z-form-field>

        <z-form-field>
          <label [attr.for]="'reps-' + plannedExercise().exercise.id" z-form-label class="text-xs text-muted-foreground">
            Target Reps
          </label>
          <z-form-control>
            <input
              z-input
              [id]="'reps-' + plannedExercise().exercise.id"
              type="number"
              min="1"
              placeholder="10"
              class="w-full text-center"
              [ngModel]="plannedExercise().target_reps"
              (ngModelChange)="onRepsChange($event)"
            />
          </z-form-control>
        </z-form-field>
      </div>
    </div>
  </div>
</z-card>
