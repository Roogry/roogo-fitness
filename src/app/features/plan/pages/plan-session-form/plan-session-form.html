<div class="min-h-screen bg-background text-foreground pb-20">
  <!-- Header -->
  <app-header
    [title]="isEditMode() ? 'Edit Session' : 'New Session'"
    [showBackBtn]="true"
    class="sticky top-0"
  >
    @if (planService.plannedExercises().length > 0) {
      <button
        right
        z-button
        zShape="circle"
        [disabled]="titleForm().invalid()"
        (click)="onSaveSessionClick()"
      >
        <ng-icon name="lucideCheck" class="hidden sm:inline-block"></ng-icon>
        <span class="ml-1 hidden sm:inline">{{ isEditMode() ? 'Update' : 'Create' }}</span>
      </button>
    }
  </app-header>

  <main class="container mx-auto px-4 pb-6 max-w-2xl mt-4">
    <z-form-field class="mb-6 flex flex-col gap-3">
      <label z-form-label for="title"> Session Title </label>
      <z-form-control
        [errorMessage]="
          titleForm.title().touched() && titleForm.title().invalid()
            ? (titleForm.title().errors()[0]?.message ?? '')
            : ''
        "
      >
        <input
          id="title"
          z-input
          placeholder="Name your session..."
          class="w-full"
          [formField]="titleForm.title"
          [zStatus]="
            titleForm.title().invalid() && titleForm.title().touched() ? 'error' : undefined
          "
        />
      </z-form-control>
    </z-form-field>

    <!-- Active Exercises -->
    <div cdkDropList (cdkDropListDropped)="onDrop($event)" class="flex flex-col gap-6">
      @if (planService.plannedExercises().length === 0) {
        <div
          class="py-8 text-center text-muted-foreground border-2 border-dashed border-border rounded-xl"
        >
          <ng-icon name="lucideDumbbell" class="h-12 w-12 mx-auto mb-4" />
          <p>Choose exercises to put in.</p>
        </div>
      }

      @for (planned of planService.plannedExercises(); track planned.id) {
        @if (exercisesMap().get(planned.exercise_id); as ex) {
          <div cdkDrag class="bg-card border border-border rounded-sm shadow-none opacity-90 cdk-drag-preview:rotate-[1deg] flex flex-col">
            <div class="flex justify-end p-2">
              <button
                cdkDragHandle
                type="button"
                class="size-11 rounded-sm bg-muted hover:bg-accent text-muted-foreground touch-none flex items-center justify-center cursor-grab active:cursor-grabbing"
                aria-label="Drag to reorder"
              >
                <ng-icon name="lucideGripVertical" class="w-4 h-4"></ng-icon>
              </button>
            </div>
            <app-plan-exercise-card
              [plannedExercise]="planned"
              [exercise]="ex"
              (updateTarget)="onUpdateTarget(planned.exercise_id, $event)"
              (remove)="onRemoveExercise(planned.exercise_id)"
            />
          </div>
        }
      }

      <button z-button zShape="circle" class="w-full" (click)="isAddSheetOpen.set(true)">
        <ng-icon name="lucidePlus"></ng-icon>
        Add Exercise
      </button>
    </div>
  </main>

  <!-- Add Exercise Sheet -->
  <app-sheet
    [isOpen]="isAddSheetOpen()"
    (onOpenChange)="isAddSheetOpen.set($event)"
    title="Add Exercise"
    description="Search or add a custom exercise."
  >
    <app-exercise-autocomplete (exerciseSelected)="onExerciseSelected($event)" />
  </app-sheet>
</div>
