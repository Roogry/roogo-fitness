<app-header title="Workout Plans" [transparent]="true"></app-header>

<div class="container max-w-2xl mx-auto px-4">
  <div class="flex flex-col gap-4">
    <!-- Start Empty Workout Action -->
    <button
      z-button
      type="button"
      zType="secondary"
      zShape="circle"
      zSize="lg"
      [disabled]="workoutService.hasExercise()"
      (click)="startEmptyWorkout()"
    >
      <ng-icon name="lucideDumbbell" class="w-4 h-4"></ng-icon>
      Start Empty Workout
    </button>

    <h2 class="font-bold">Your Plans</h2>

    @if (displayedPlans.length === 0) {
      <div
        class="flex flex-col items-center justify-center text-center p-10 border border-border rounded-[28px] bg-card"
      >
        <div class="p-4 bg-secondary border border-border rounded-full mb-4">
          <ng-icon name="lucideDumbbell" class="w-8 h-8 text-muted-foreground"></ng-icon>
        </div>
        <h3 class="font-semibold text-lg mb-1">No Plans Yet</h3>
        <p class="text-sm text-muted-foreground">Create your first workout plan to get started.</p>

        <button z-button type="button" class="mt-4" (click)="openCreatePlanSheet()">
          <ng-icon name="lucidePlus"></ng-icon>
          <div><span class="hidden sm:inline-block">Create</span> Plan</div>
        </button>
      </div>
    } @else {
      @for (plan of displayedPlans; track plan.id) {
        <app-plan-card
          [plan]="plan"
          [isExpanded]="expandedPlanId() === plan.id"
          (onToggle)="togglePlan(plan.id)"
          (onEdit)="editPlan($event, plan)"
          (onDelete)="deletePlan($event, plan.id)"
        ></app-plan-card>
      }

      <button
        z-button
        zType="dashed"
        zSize="lg"
        type="button"
        class="font-bold touch-manipulation select-none"
        (click)="openCreatePlanSheet()"
      >
        <ng-icon name="lucidePlus" size="24"></ng-icon>
        <div><span class="hidden sm:inline-block">Create</span> New Plan</div>
      </button>
    }
  </div>

  <!-- Plan Form Sheet -->
  <app-sheet
    [isOpen]="isOpenPlanForm()"
    (onOpenChange)="isOpenPlanForm.set($event)"
    [title]="planService.selectedPlanId() ? 'Edit Plan' : 'Create Plan'"
    description="Design your new workout routine."
  >
    <!-- Sheet Content (Scrollable) -->
    <div class="flex flex-col gap-6">
      <z-form-field class="flex flex-col gap-3">
        <label z-form-label for="name"> Plan Name <span class="text-destructive">*</span> </label>
        <z-form-control
          [errorMessage]="
            (planForm.title().touched() || planForm.title().dirty()) && planForm.title().invalid()
              ? (planForm.title().errors()[0]?.message ?? '')
              : ''
          "
        >
          <input
            id="name"
            z-input
            [formField]="planForm.title"
            [zStatus]="
              (planForm.title().touched() || planForm.title().dirty()) && planForm.title().invalid()
                ? 'error'
                : undefined
            "
            placeholder="e.g. Push Pull Legs"
            class="w-full"
          />
        </z-form-control>
      </z-form-field>

      <z-form-field class="flex flex-col gap-3">
        <label z-form-label for="description"> Description </label>
        <z-form-control [errorMessage]="planForm.description().errors()[0]?.message ?? ''">
          <textarea
            id="description"
            z-input
            rows="3"
            [formField]="planForm.description"
            placeholder="Optional details about this plan..."
            class="w-full"
          ></textarea>
        </z-form-control>
      </z-form-field>

      <div class="flex flex-col gap-4">
        <div class="flex items-center justify-between">
          <label class="text-sm font-medium leading-none">Sessions Per Week</label>
        </div>

        <div class="bg-card border border-border rounded-[20px] p-4 flex flex-col gap-3">
          <div class="relative">
            <input
              type="range"
              min="1"
              max="7"
              step="1"
              [value]="planModel().sessionsPerWeek"
              (input)="onSliderInput($event)"
              class="w-full h-2 rounded-full appearance-none cursor-pointer border border-border"
              [style.background]="
                'linear-gradient(to right, var(--lime) 0%, var(--lime) ' +
                sliderPercent() +
                '%, var(--mist) ' +
                sliderPercent() +
                '%, var(--mist) 100%)'
              "
            />
          </div>
          <div class="flex justify-between px-1">
            @for (n of [1, 2, 3, 4, 5, 6, 7]; track n) {
              <span
                class="font-mono text-[11px] w-5 text-center transition-colors"
                [class.text-foreground]="n === planModel().sessionsPerWeek"
                [class.font-bold]="n === planModel().sessionsPerWeek"
                [class.text-muted-foreground]="n !== planModel().sessionsPerWeek"
                >{{ n }}</span
              >
            }
          </div>
        </div>

        <div class="bg-muted border border-border rounded-2xl px-4 py-3 flex gap-3 items-start">
          <ng-icon
            name="lucideFlame"
            class="w-4 h-4 mt-0.5 shrink-0 transition-colors"
            [class]="flameClass()"
          ></ng-icon>
          <p class="text-sm leading-relaxed text-muted-foreground">
            {{ scheduleDescription() }}
          </p>
        </div>
      </div>
    </div>

    <!-- Sheet Footer — Batal + Simpan dark bold -->
    <div app-sheet-footer class="flex gap-3 w-full">
      <button
        z-button
        zType="ghost"
        zShape="circle"
        class="flex-1 font-bold text-muted-foreground"
        (click)="isOpenPlanForm.set(false)"
      >
        Batal
      </button>
      <button
        z-button
        zShape="circle"
        class="flex-1 font-bold"
        [disabled]="planForm().invalid()"
        (click)="savePlan()"
      >
        Simpan
      </button>
    </div>
  </app-sheet>
</div>
